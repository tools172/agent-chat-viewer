# git-cliff configuration for agent-chat-viewer.
#
# Release notes are generated from Conventional Commits:
#   git-cliff --config cliff.toml --latest --strip header --output release-notes.md
#
# 只有用户可见的变更会进入 changelog；测试、文档、CI、构建、重构等内部改动
# 会被跳过。提交时请按实际类型书写前缀，类型决定它出现在哪个分组。

[changelog]
header = ""
body = """
{% if version %}\
## {{ version | trim_start_matches(pat="v") }}{% if timestamp %} - {{ timestamp | date(format="%Y-%m-%d") }}{% endif %}
{% else %}\
## 未发布
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group }}
{% for commit in commits %}\
- {% if commit.breaking %}**[破坏性变更]** {% endif %}\
{% if commit.scope %}**{{ commit.scope }}**：{% endif %}{{ commit.message }}
{% endfor %}\
{% endfor %}\n
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
commit_parsers = [
    { message = "^feat", group = "新功能" },
    { message = "^fix", group = "修复" },
    { message = "^perf", group = "性能" },
    { message = "^revert", group = "回滚" },

    # Internal-only changes do not belong in user-facing release notes.
    { message = "^refactor", skip = true },
    { message = "^docs", skip = true },
    { message = "^test", skip = true },
    { message = "^ci", skip = true },
    { message = "^build", skip = true },
    { message = "^style", skip = true },
    { message = "^chore", skip = true },
]
tag_pattern = "v[0-9]*"
sort_commits = "oldest"
