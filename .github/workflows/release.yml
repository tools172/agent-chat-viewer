name: Release

# Trigger: push a tag that starts with "v" (e.g. v0.2.1)
on:
  push:
    tags:
      - 'v*'

# Allow the job to create a GitHub Release and upload assets
permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: '1.95.0'

jobs:
  release:
    name: Build & publish Windows installer
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # git-cliff 需要完整历史和所有 tag，才能计算出上一个版本到当前版本的范围
          fetch-depth: 0

      - name: Verify tag matches version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $ver = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($tag -ne "v$ver") { throw "tag '$tag' 与 tauri.conf.json 版本 '$ver' 不一致" }
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($pkg -ne $ver) { throw "package.json 版本 '$pkg' 与 tauri.conf.json 版本 '$ver' 不一致" }

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri application (produces .exe and .msi)
        run: pnpm tauri build

      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff@2

      - name: Generate changelog
        shell: pwsh
        run: git-cliff --config cliff.toml --latest --strip header --output release-notes.md

      - name: Publish installers to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          fail_on_unmatched_files: false
          body_path: release-notes.md
