# GitHub 自动生成 Release Notes 的分类规则。
# 文档：https://docs.github.com/zh/repositories/releasing-projects-on-github/automatically-generated-release-notes
#
# 作用：
#   - 只影响 GitHub 按 PR 自动生成的 Release 正文，不处理直接推送的 commit。
#   - 本文件必须位于默认分支（main）才会生效。
#   - PR 按标签（label）归入对应分类，第一个匹配到的分类生效；
#     没有匹配到任何分类的 PR 会落到最后的“其他变更”（labels: ['*']）。
#   - 打了 exclude.labels 的 PR 不会出现在正文里。
#
# 使用方式（每次合并 dev → main 时）：
#   1. 给 PR 打上与内容相符的标签，例如 feat / fix / chore。
#   2. 只改版本号、发版专用的 PR 打上 skip-changelog，避免其出现在正文里。
#   3. 一个 PR 同时涉及多种类型时，按主要类型打一个标签即可。

changelog:
  exclude:
    # 打了这些标签的 PR 不出现在 Release 正文里
    labels:
      - skip-changelog
    # 这些作者提交的 PR 不出现在 Release 正文里
    authors:
      - dependabot

  categories:
    - title: 新功能
      labels:
        - feat
        - feature
        - enhancement

    - title: 修复
      labels:
        - fix
        - bug

    - title: 性能优化
      labels:
        - perf

    - title: 重构与文档
      labels:
        - refactor
        - docs

    - title: 构建与依赖
      labels:
        - chore
        - ci
        - build
        - dependencies

    # 兜底分类：没有匹配到上面任何标签的 PR 会放在这里
    - title: 其他变更
      labels:
        - '*'
