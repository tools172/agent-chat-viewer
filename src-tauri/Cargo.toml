[package]
name = "agent-chat-viewer"
version = "0.1.0"
description = "A desktop app for viewing Claude Code chat records"
authors = ["dev"]
edition = "2021"
license = "MIT"
repository = "https://github.com/user/agent-chat-viewer"

[lib]
name = "agent_chat_viewer_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
walkdir = "2"

[dev-dependencies]
tempfile = "3"
